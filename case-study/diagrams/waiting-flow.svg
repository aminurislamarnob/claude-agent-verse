<svg viewBox="0 0 940 380" role="img" aria-label="Sequence of waiting-on-you detection. Without hooks, an open tool call that receives no tool_result after 15 seconds is promoted to waiting_on_user on the next tick. With the hook forwarder installed, a PermissionRequest event posts to /api/hooks and flips the session to waiting_on_user immediately, even if the tool_use transcript line arrives afterward." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="sh" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="d-m" d="M0 0L8 4L0 8z"/></marker>
    <marker id="sa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="d-ma" d="M0 0L8 4L0 8z"/></marker>
  </defs>

  <line class="d-life" x1="110" y1="56" x2="110" y2="360"/>
  <line class="d-life" x1="360" y1="56" x2="360" y2="360"/>
  <line class="d-life" x1="610" y1="56" x2="610" y2="360"/>
  <line class="d-life" x1="830" y1="56" x2="830" y2="360"/>

  <rect class="d-box" x="35" y="20" width="150" height="36" rx="6"/><text class="d-t" x="110" y="43" text-anchor="middle">Claude Session</text>
  <rect class="d-box" x="285" y="20" width="150" height="36" rx="6"/><text class="d-t" x="360" y="43" text-anchor="middle">Hook / Tailer</text>
  <rect class="d-box" x="535" y="20" width="150" height="36" rx="6"/><text class="d-t" x="610" y="43" text-anchor="middle">Core Reducer</text>
  <rect class="d-box" x="755" y="20" width="150" height="36" rx="6"/><text class="d-t" x="830" y="43" text-anchor="middle">3D Office &amp; Tab</text>

  <line class="d-l" x1="110" y1="94" x2="354" y2="94" marker-end="url(#sh)"/>
  <text class="d-t" x="235" y="86" text-anchor="middle">assistant tool_use written to .jsonl</text>

  <line class="d-l" x1="360" y1="134" x2="604" y2="134" marker-end="url(#sh)"/>
  <text class="d-t" x="485" y="126" text-anchor="middle">transcript_line → state = working</text>

  <line class="d-a" x1="110" y1="182" x2="604" y2="182" marker-end="url(#sa)"/>
  <text class="d-at" x="357" y="172" text-anchor="middle">Exact path: PermissionRequest hook → POST /api/hooks (instant)</text>

  <line class="d-l d-dash" x1="360" y1="226" x2="604" y2="226" marker-end="url(#sh)"/>
  <text class="d-t" x="485" y="218" text-anchor="middle">Passive path: tick after 15 s without tool_result</text>

  <rect class="d-check" x="470" y="250" width="280" height="48" rx="6"/>
  <text class="d-t" x="610" y="271" text-anchor="middle">state = waiting_on_user</text>
  <text class="d-s" x="610" y="288" text-anchor="middle">hookWaiting blocks late tool_use overwrite</text>

  <line class="d-a" x1="610" y1="328" x2="824" y2="328" marker-end="url(#sa)"/>
  <text class="d-at" x="717" y="318" text-anchor="middle">Amber &quot;!&quot; paddle + (N) tab badge</text>
</svg>
